# Hybrid Contextual Model Routing — Default Configuration
#
# This file ships with the plugin. To configure, create a copy at:
# $HERMES_HOME/hybrid_routing/routing_config.yaml
# (`HERMES_HOME` is ~/.hermes for the default profile or
# ~/.hermes/profiles/<name> for a named profile.)
# Then fill in YOUR model refs below.
#
# Models are referenced as "provider/model-id" matching Hermes provider names.
# Refs must be 512 characters or fewer and contain no whitespace or control
# characters. Both provider and model-id must be non-empty.
# Run `hermes auth list` to see which providers you have configured.
# Run `hermes model` to see your available models.
#
# ── Tiers ──────────────────────────────────────────────────────────────
# Three cost/capability tiers. Fill in model refs for providers YOU have.
# Leave blank if you don't have a model for that tier — the router will
# skip blank tiers and fall through to the next available one.

tiers:
  fast:
    # Example: ollama-cloud/glm-5.2, custom:local-myserver/my-model
    model: ""
    description: "Quick chats, formatting, simple Q&A, acknowledgments"
    max_input_tokens: 2000

  balanced:
    # Example: openai-codex/gpt-5.6-sol, ollama-cloud/glm-5.2
    model: ""
    description: "Most work — code, research, analysis, content drafting"
    max_input_tokens: 128000

  strong:
    # Example: xai-oauth/grok-4.5, anthropic/claude-opus-4-7
    model: ""
    description: "Deep strategy, complex multi-step reasoning, CIO-level decisions"
    max_input_tokens: 128000

# ── Roles ──────────────────────────────────────────────────────────────
# Role-based routing overrides the tier when a task clearly matches a
# specialized role. Leave model blank to let the tier handle it.

roles:
  coding:
    # Example: openai-codex/gpt-5.6-sol
    model: ""
    description: "Code writing, debugging, refactoring, architecture"
    cues:
      - "code"
      - "debug"
      - "refactor"
      - "function"
      - "class"
      - "test"
      - "pytest"
      - "import"
      - "API endpoint"
      - "bug"
      - "stack trace"
      - "pull request"
      - "git commit"

  research:
    # Example: openai-codex/gpt-5.6-sol
    model: ""
    description: "Research, literature review, paper analysis, web investigation"
    cues:
      - "research"
      - "paper"
      - "arxiv"
      - "literature"
      - "study"
      - "analysis"
      - "benchmark"
      - "compare"
      - "evaluate"
      - "survey"
      - "find"
      - "search for"

  creative:
    # Example: anthropic/claude-sonnet-4-6, ollama-cloud/glm-5.2
    model: ""
    description: "Creative writing, blog posts, social content, narratives"
    cues:
      - "write a blog"
      - "blog post"
      - "story"
      - "narrative"
      - "creative"
      - "draft an article"
      - "social media post"
      - "tweet"
      - "thread"
      - "content"

  strategy:
    # Example: xai-oauth/grok-4.5, anthropic/claude-opus-4-7
    model: ""
    description: "Strategic planning, architecture decisions, CIO-level analysis"
    cues:
      - "strategy"
      - "roadmap"
      - "architecture decision"
      - "business plan"
      - "go-to-market"
      - "competitive analysis"
      - "SWOT"
      - "strategic"
      - "vision"
      - "direction"
      - "prioritize"

  vision:
    # Usually handled by Hermes' built-in auxiliary.vision config
    model: ""
    description: "Image analysis, screenshots, visual content"
    auxiliary: true

  general:
    # Example: ollama-cloud/glm-5.2
    model: ""
    description: "Default — no specific role detected"
    cues: []

# ── Model egress metadata ──────────────────────────────────────────────
# Exact model refs may be declared "local" or "external". Refs omitted here
# remain "unknown". The router never infers locality
# from a provider name or model-id. A "local" value is an operator attestation:
# keep it aligned with the provider's real endpoint/base_url.
#
# Example after verifying the destination:
# egress_schema_version: 1
# model_egress:
#   "custom:local-laguna/poolside/Laguna-S-2.1-NVFP4": local
#   "ollama-cloud/glm-5.2": external
#
# Keep this version marker with copied 1.1+ configurations. A missing marker is
# treated as a legacy schema and can never authorize a sensitive route.
egress_schema_version: 1
model_egress: {}

# ── Sensitivity ────────────────────────────────────────────────────────
# Bundled patterns are a non-removable safety baseline. Patterns in a copied
# override are additive and may extend, but never replace, those detectors.
# Sensitive content is routed only when local_only_model exactly matches a ref
# explicitly marked "local" in model_egress. Otherwise routing fails closed.
# The metadata is operator-declared; the plugin cannot verify physical transport.
sensitivity:
  local_only_model: ""
  # Baseline heuristics cover common assignments, bounded non-metadata-qualified
  # variables, bearer credentials, private-key headers, well-known token prefixes,
  # database URIs with embedded passwords, SSN/card-number formats, and
  # confidentiality markers. Policy/status variables and explicit negated
  # state prose are excluded from assignment detection.
  # They are not a complete secret-scanning, PII, or DLP boundary.
  patterns:
    - >-
      (?ix)
      (?:\b|_)
      (?:api[\s_-]*key|secret[\s_-]*(?:access[\s_-]*)?key|password|(?:access[\s_-]*)?token|dbpassword|clientsecret|secret)
      (?:
        [_-]
        (?!(?:file|path|policy|budget|rotation|ttl|expiry|expiration|status|format|documentation|santa|days?)(?:[_-]|\b))
        [a-z0-9]{1,32}
      ){0,4}
      (?:
        ["']?\s*(?::|=)\s*
        (?:
          ["'](?!(?:none|null|unset|missing|absent|not[-_\s]+configured)["'](?=\s*(?:[,;}\]]|$)))\S+
          |
          (?!["'])(?!(?:none|null|unset|missing|absent|not[-_\s]+configured)(?=\s*(?:[,;}\]]|$)))\S+
        )
        |
        \s+(?:is|equals?)\s+
        (?!(?:(?:actually|currently|definitely|generally|normally|really|securely|temporarily)\s+){0,3}(?:(?:not|never)\s+(?:(?:actually|currently|definitely|generally|normally|really|securely|temporarily)\s+){0,3}(?:stored|logged|set|configured|available|present)|no\s+(?:stored\s+)?value|(?:none|null|unset|missing|absent))[.,;!?]?(?=\s|$))
        \S+
      )
    - >-
      (?ix)
      \b(?:api[\s_-]+key|password|token|secret(?:\s+key)?)
      (?:['’]s)?
      (?:\s+(?:current\s+value|value|actually|currently|definitely|generally|normally|really|securely|temporarily)){0,3}
      (?:\s+for\s+(?:the\s+)?[a-z0-9_.-]{1,64}(?:\s+(?:environment|env|account|tenant|workspace|cluster|service|application|app|database|db|region)){0,2})?
      (?:\s+(?:current\s+value|value|actually|currently|definitely|generally|normally|really|securely|temporarily)){0,3}
      \s+(?:is|equals?)\s+
      (?!(?:(?:actually|currently|definitely|generally|normally|really|securely|temporarily)\s+){0,3}(?:(?:not|never)\s+(?:(?:actually|currently|definitely|generally|normally|really|securely|temporarily)\s+){0,3}(?:stored|logged|set|configured|available|present)|no\s+(?:stored\s+)?value|(?:none|null|unset|missing|absent))[.,;!?]?(?=\s|$))
      \S+
    - >-
      (?ix)
      (?:\bauthorization\s*:\s*)?\bbearer\s+
      (?!
        (?:
          (?:tokens?|authentication|authorization|credentials?|policy|scheme|header|budget|rotation|ttl|expiry|expiration|status|format|documentation|supply|assembly|family)
          \s+(?:is|are|was|were|should|must|can|means|represents|uses?|has|have)
          |
          token\s+(?:policy|scheme|header|budget|rotation|ttl|expiry|expiration|status|format|documentation|supply|assembly|family)
          \s+(?:is|are|was|were|should|must|can|means|represents|uses?|has|have)
        )\b(?=\s+[a-z])
      )
      (?:token\s+)?[a-z0-9._~+/=-]+
    - "(?i)-----BEGIN (?:(?:ENCRYPTED|RSA|EC|OPENSSH|DSA) PRIVATE KEY|PRIVATE KEY|PGP PRIVATE KEY BLOCK)-----"
    - "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    - "\\b(?:\\d[ -]?){13,16}\\b"
    - "(?i)(?:\\b(?:highly\\s+confidential|confidential|restricted|secret|internal only)\\b|\\bmip:)"
    - >-
      (?ix)
      (?:\b|_)
      (?:aws[_-]?access[_-]?key[_-]?id|openai[_-]?key|private[_-]?key|
         encryption[_-]?key|master[_-]?key|signing[_-]?key|passwd|db[_-]?pass)
      ["']?\s*(?::|=)\s*\S+
    - >-
      (?ix)
      \b(?:sk-[a-z0-9_-]{16,}|ghp_[a-z0-9]{20,}|github_pat_[a-z0-9_]{20,}|
         xox[baprs]-[a-z0-9-]{10,}|akia[0-9a-z]{16}|
         eyj[a-z0-9_-]{8,}\.[a-z0-9_-]{8,}\.)
    - >-
      (?ix)
      \b(?:postgres(?:ql)?|mysql|mongodb|redis|amqp)://[^\s:/]+:[^\s@/]+@
    - >-
      (?ix)
      \bauthorization\s*:\s*(?:token|basic)\s+\S+

# ── Difficulty Classification ──────────────────────────────────────────
# These heuristics work out of the box — no configuration needed.
difficulty:
  hard_cues:
    - "analyz"
    - "architect"
    - "debug"
    - "refactor"
    - "\\bprov(?:e|es|ed|ing)\\b"
    - "derive"
    - "optimi[sz]"
    - "trade[- ]?off"
    - "step[- ]by[- ]step"
    - "reason through"
    - "root cause"
    - "algorithm"
    - "complexity"
    - "strateg"
    - "implement"
    - "compare"
    - "evaluate"
    - "design (a|an|the)"
    - "explain why"
    - "walk me through"
    - "plan (a|an|the|out)"
  simple_cues:
    - "^\\s*(hi|hey|hello|yo|sup|thanks|thank you|ty|ok|okay|k|yes|yep|no|nope|got it|cool|nice|great|good morning|good night|gm|gn)\\b"
  hard_if_code_block: true
  hard_if_long_input: 600
  hard_if_many_words: 80
  hard_if_many_lines: 8
  simple_if_short_words: 4

# ── Delegation Threshold ───────────────────────────────────────────────
# Set primary_model to match YOUR session's default model.
# Leave blank to always delegate (not recommended).
# A skipped tier stays inline only when the selected model is the primary model;
# role overrides and fallback tiers still recommend separate execution.
delegation:
  skip_for_tier: [fast]
  skip_if_same_as_primary: true
  primary_model: ""