[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-hybrid-routing"
version = "1.0.1"
description = "Advisory contextual model routing for Hermes agents by sensitivity, role, and difficulty"
readme = "README.md"
license = "MIT"
authors = [
    {name = "SMF Works", email = "aionaedge@agentmail.to"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

keywords = ["hermes", "ai-agent", "model-routing", "contextual-switching", "delegation", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.11",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=6.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/smfworks/hermes-plugin-hybrid-routing"
Repository = "https://github.com/smfworks/hermes-plugin-hybrid-routing"
Documentation = "https://github.com/smfworks/hermes-plugin-hybrid-routing#readme"

# pip entry point — enables `pip install hermes-plugin-hybrid-routing`
# and Hermes discovers it via the hermes_agent.plugins entry point group
[project.entry-points."hermes_agent.plugins"]
hybrid-contextual-routing = "hybrid_contextual_routing"

[tool.setuptools]
include-package-data = false
packages = ["hybrid_contextual_routing"]

[tool.setuptools.package-data]
hybrid_contextual_routing = ["plugin.yaml", "data/*.yaml", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
python_version = "3.10"
warn_unused_ignores = true