name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy hybrid_contextual_routing tests
      - name: Pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q
      - name: Package
        run: |
          python -m build
          twine check dist/*

  package-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify sdist ships license and manifests
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python - <<'PY'
          import tarfile
          from pathlib import Path

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(sdists) == 1, sdists
          names = tarfile.open(sdists[0]).getnames()
          required = (
              "LICENSE",
              "plugin.yaml",
              "hybrid_contextual_routing/plugin.yaml",
              "hybrid_contextual_routing/data/routing_config.yaml",
              "docs/EGRESS-TRUST-MODEL.md",
          )
          missing = [item for item in required if not any(name.endswith(item) for name in names)]
          assert not missing, missing
          print(f"sdist ok: {sdists[0].name} ({len(names)} members)")
          PY
