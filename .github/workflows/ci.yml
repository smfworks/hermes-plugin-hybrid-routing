name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy hybrid_contextual_routing/ || true

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Security scan (bandit)
        run: bandit -r hybrid_contextual_routing/ -f json -o bandit-report.json || true

      - name: Build package
        run: python -m build

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: bandit -r hybrid_contextual_routing/ -ll

      - name: Check for hardcoded secrets
        run: |
          ! grep -rnE "(api_key|secret|password|token)\s*=\s*['\"][^'\"]{8,}" \
            --include="*.py" \
            hybrid_contextual_routing/ tests/ || true